<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Hunza Shahzadi, Data Science at FAST NUCES" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @font-face { font-family:'PFName'; src:url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family:'PFTag';  src:url(data:font/woff2;base64,) format('woff2'); }
      .name { font-family:'PFName', 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight:700; fill:url(#nameGrad); }
      .tag  { font-family:'PFTag', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style:italic; }
      .mark { font-family:'PFName', 'Playfair Display', Georgia, serif; font-weight:700; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0014"/>
      <stop offset="0.55" stop-color="#2a1259"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.1" stop-color="#fff"/>
      <stop offset="0.9" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="320">
      <rect width="1000" height="320" fill="url(#edge)"/>
    </mask>
  </defs>

  <rect width="1000" height="320" rx="20" fill="url(#bg)"/>

  <!-- big faint serif "h" in the background (nod to the inspo image) -->
  <text x="835" y="300" class="mark" font-size="420" fill="#ffffff" opacity="0.07">h</text>

  <!-- editorial lines above and below the moving name -->
  <line x1="40" y1="62" x2="960" y2="62" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="40" y1="206" x2="960" y2="206" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1"/>

  <!-- THE ONLY ANIMATION: the name scrolls like a marquee, seamless loop -->
  <g mask="url(#fade)">
    <g>
      <text x="0" y="165" class="name" font-size="84" textLength="627" lengthAdjust="spacing">Hunza Shahzadi</text>
      <polygon points="687.0,138 697.0,126 707.0,138 697.0,150" fill="#8b5cf6"/>
      <text x="767" y="165" class="name" font-size="84" textLength="627" lengthAdjust="spacing">Hunza Shahzadi</text>
      <polygon points="1454.0,138 1464.0,126 1474.0,138 1464.0,150" fill="#8b5cf6"/>
      <text x="1534" y="165" class="name" font-size="84" textLength="627" lengthAdjust="spacing">Hunza Shahzadi</text>
      <polygon points="2221.0,138 2231.0,126 2241.0,138 2231.0,150" fill="#8b5cf6"/>
      
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-767 0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="500" y="262" text-anchor="middle" class="tag" font-size="26" fill="#c4b5fd">Data Science @ FAST NUCES · Training models the Hiccup way</text>
</svg>